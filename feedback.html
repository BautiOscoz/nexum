<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexum · Feedback</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="dashboard.html" class="brand">
      <span class="brand-logo">N</span> Nexum
    </a>
    <div class="topbar-actions">
      <button id="lang-toggle" class="topbar-btn"></button>
      <button id="logout" class="topbar-btn" data-i18n="nav.logout"></button>
    </div>
  </header>

  <main class="container narrow">
    <a href="dashboard.html" class="back-link" data-i18n="nav.back"></a>
    <h1 data-i18n="feedback.title"></h1>
    <p class="subtitle" data-i18n="feedback.subtitle"></p>

    <div class="toolbar">
      <select id="status-filter">
        <option value="all" data-i18n="feedback.filter.all"></option>
        <option value="pending" data-i18n="status.pending"></option>
        <option value="approved" data-i18n="status.approved"></option>
        <option value="observed" data-i18n="status.observed"></option>
        <option value="rejected" data-i18n="status.rejected"></option>
      </select>
    </div>

    <div id="review-list"></div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/feedback.js"></script>
</body>
</html>
