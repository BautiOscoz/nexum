<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexum · Deliverables</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="dashboard.html" class="brand">
      <span class="brand-logo">N</span> Nexum
    </a>
    <div class="topbar-actions">
      <button id="lang-toggle" class="topbar-btn"></button>
      <button id="logout" class="topbar-btn" data-i18n="nav.logout"></button>
    </div>
  </header>

  <main class="container narrow">
    <a href="dashboard.html" class="back-link" data-i18n="nav.back"></a>
    <h1 data-i18n="deliv.title"></h1>
    <p class="subtitle" data-i18n="deliv.subtitle"></p>

    <form id="upload-form" class="form-card" novalidate>
      <h2 data-i18n="deliv.new"></h2>

      <label for="type" data-i18n="deliv.type"></label>
      <select id="type">
        <option value="progress1" data-i18n="types.progress1"></option>
        <option value="progress2" data-i18n="types.progress2"></option>
        <option value="final" data-i18n="types.final"></option>
      </select>

      <label for="file" data-i18n="deliv.file"></label>
      <input id="file" type="file">
      <p class="small-muted" data-i18n="deliv.demoNote"></p>

      <label for="note" data-i18n="deliv.note"></label>
      <textarea id="note" rows="2" data-i18n-placeholder="deliv.note.ph"></textarea>

      <p id="upload-error" class="form-error" data-i18n="deliv.fileRequired" hidden></p>
      <button type="submit" class="btn-primary" data-i18n="deliv.submit"></button>
    </form>

    <h2 class="section-title" data-i18n="deliv.history"></h2>
    <p class="small-muted" data-i18n="deliv.noDelete"></p>
    <div id="submission-list"></div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/deliverables.js"></script>
</body>
</html>
