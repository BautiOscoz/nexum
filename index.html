<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexum</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="logo">N</div>
    <h1>Nexum</h1>
    <p class="subtitle" data-i18n="login.subtitle"></p>

    <form id="login-form">
      <label for="role" data-i18n="login.role"></label>
      <select id="role">
        <option value="student" data-i18n="roles.student"></option>
        <option value="teacher" data-i18n="roles.teacher"></option>
      </select>
      <button type="submit" data-i18n="login.enter"></button>
    </form>

    <button id="lang-toggle" class="lang-toggle"></button>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
